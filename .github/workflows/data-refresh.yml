name: data-refresh

# Fetches CelesTrak GP data, validates it and deploys it to production with
# the Vercel CLI. Spec and fair-use rules: docs/ci-cd.md. Data is never
# committed (ADR 0001). Any failure before the deploy step leaves the last
# good data live.

on:
  schedule:
    # Every 6 hours at minute 23, away from the busy top of the hour.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@65.17.0

jobs:
  refresh:
    # Skip cleanly (instead of failing every 6 h) until the Vercel project and
    # the PRODUCTION_URL variable are set up.
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Skips the run if live data is under 2 hours old (one download per
      # CelesTrak update, even for manual runs and re-runs).
      - name: Freshness guard
        id: freshness
        run: npm run check-freshness

      # One request per group, one at a time, stop at the first non-200, no
      # retries. The "not updated since your last download" 403 sets
      # skipped=true and exits 0; any other error fails the run.
      - name: Fetch and validate
        id: fetch
        if: steps.freshness.outputs.fresh != 'true'
        run: npm run fetch-data

      - name: Build and deploy to production
        if: steps.freshness.outputs.fresh != 'true' && steps.fetch.outputs.skipped == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Upload data artifact
        if: steps.fetch.outputs.skipped == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellites-json
          path: public/data/satellites.json
          retention-days: 7
